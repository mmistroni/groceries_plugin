{% extends "base.html" %}

{% block content %}
<div class="glass-card rounded-2xl p-6 space-y-6">
    <!-- Filter Toolbar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/60 pb-6">
        <div class="flex flex-wrap items-center gap-3">
            <!-- Search Input -->
            <div class="relative w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                <input type="text" 
                       name="search" 
                       placeholder="Search description..." 
                       hx-get="/expenses/search" 
                       hx-trigger="keyup changed delay:400ms, search" 
                       hx-target="#expenses-list"
                       hx-include="[name='user_filter'], [name='category_filter']"
                       class="w-full bg-slate-900 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-600 outline-none transition-all">
            </div>

            <!-- User Filter -->
            <select name="user_filter" 
                    hx-get="/expenses/search" 
                    hx-trigger="change" 
                    hx-target="#expenses-list"
                    hx-include="[name='search'], [name='category_filter']"
                    class="bg-slate-900 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl px-4 py-2.5 text-xs text-white outline-none transition-all">
                <option value="">All Users</option>
                <option value="simone">simone</option>
                <option value="marco">marco</option>
                <option value="marco and simone">marco & simone</option>
                <option value="directdebit">directdebit</option>
                <option value="bulkupload">bulkupload</option>
            </select>

            <!-- Category Filter Dropdown -->
            <select name="category_filter" 
                    hx-get="/expenses/search" 
                    hx-trigger="change" 
                    hx-target="#expenses-list"
                    hx-include="[name='search'], [name='user_filter']"
                    class="bg-slate-900 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-xl px-4 py-2.5 text-xs text-white outline-none transition-all">
                <option value="">All Categories</option>
                {% for category in ExpenseTypeEnum %}
                    <option value="{{ category.value }}">{{ category.display_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Add Expense Trigger Button -->
        <button hx-get="/expenses/new" 
                hx-target="#expenses-list" 
                hx-swap="afterbegin" 
                class="bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs px-5 py-3 rounded-xl transition-all shadow-md shadow-brand-500/10 flex items-center gap-2">
            <i class="fa-solid fa-plus text-xs"></i> Add Expense Entry
        </button>
    </div>

    <!-- Expenses Table -->
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-slate-800 text-slate-400 text-xs font-semibold uppercase tracking-wider">
                    <th class="py-3 px-4 w-[15%]">Date</th>
                    <th class="py-3 px-4 w-[35%]">Description</th>
                    <th class="py-3 px-4 w-[15%]">User</th>
                    <th class="py-3 px-4 w-[10%] text-center">Category</th>
                    <th class="py-3 px-4 w-[15%] text-right">Amount</th>
                    <th class="py-3 px-4 w-[10%] text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="expenses-list" class="divide-y divide-slate-800/40 text-sm">
                {% for expense in expenses %}
                    {% include "partials/expense_row.html" %}
                {% else %}
                    <tr>
                        <td colspan="6" class="py-12 text-center text-slate-500">
                            <i class="fa-solid fa-receipt text-4xl mb-3 block"></i>
                            No expenses matching the filters.
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
