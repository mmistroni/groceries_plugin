<tr id="rule-row-{{ rule.id }}" class="hover:bg-slate-900/30 transition-all">
    <td class="py-3 px-4 font-semibold text-white">
        {{ rule.description }}
    </td>
    <td class="py-3 px-4">
        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold uppercase {% if rule.rule_type == 'direct_debit' %}bg-violet-500/10 text-violet-400 border border-violet-500/20{% else %}bg-cyan-500/10 text-cyan-400 border border-cyan-500/20{% endif %}">
            {{ 'Direct Debit' if rule.rule_type == 'direct_debit' else 'Lump Sum' }}
        </span>
    </td>
    <td class="py-3 px-4 text-center font-semibold text-white">
        Day {{ rule.day_of_month }}
    </td>
    <td class="py-3 px-4 text-center font-mono text-slate-400">
        {{ rule.expense_type if rule.expense_type is not none else '-' }}
    </td>
    <td class="py-3 px-4 text-slate-300">
        {{ rule.user }}
    </td>
    <td class="py-3 px-4 text-right font-semibold {% if rule.amount < 0 %}text-rose-400{% else %}text-emerald-400{% endif %}">
        £{{ "%.2f"|format(rule.amount) }}
    </td>
    <td class="py-3 px-4 text-center">
        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase {% if rule.is_active %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}bg-slate-800 text-slate-500 border border-slate-700{% endif %}">
            {{ 'Active' if rule.is_active else 'Inactive' }}
        </span>
    </td>
    <td class="py-3 px-4 whitespace-nowrap text-right text-sm font-medium">
        <button hx-get="/admin-settings/rules/{{ rule.id }}/edit" hx-target="#rule-row-{{ rule.id }}" hx-swap="outerHTML" class="text-brand-400 hover:text-brand-300 mr-3 transition-colors" title="Edit">
            <i class="fa-solid fa-pen"></i>
        </button>
        <button hx-delete="/admin-settings/rules/{{ rule.id }}" hx-target="#rule-row-{{ rule.id }}" hx-swap="outerHTML" hx-confirm="Are you sure you want to delete this scheduled rule?" class="text-rose-400 hover:text-rose-300 transition-colors" title="Delete">
            <i class="fa-solid fa-trash"></i>
        </button>
    </td>
</tr>
