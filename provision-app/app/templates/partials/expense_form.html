<tr id="expense-row-{{ expense.id or 'new' }}" class="bg-brand-950/20 border-y border-brand-500/20">
    <td class="p-2" colspan="6">
        <form hx-post="{% if expense.id %}/expenses/{{ expense.id }}/edit{% else %}/expenses/new{% endif %}" hx-target="#expense-row-{{ expense.id or 'new' }}" hx-swap="outerHTML" class="grid grid-cols-12 gap-3 items-center">
            <div class="col-span-2">
                <input type="date" name="date" required value="{{ expense.date.strftime('%Y-%m-%d') if expense.date else today_str }}" class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none">
            </div>
            <div class="col-span-3">
                <input type="text" name="description" required value="{{ expense.description or '' }}" placeholder="Description (e.g., Tesco groceries)" class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none">
            </div>
            <div class="col-span-2">
                <select name="user" class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-lg px-2 py-1.5 text-xs text-white outline-none">
                    <option value="simone" {% if expense.user == 'simone' %}selected{% endif %}>simone</option>
                    <option value="marco" {% if expense.user == 'marco' %}selected{% endif %}>marco</option>
                    <option value="marco and simone" {% if expense.user == 'marco and simone' %}selected{% endif %}>marco & simone</option>
                    <option value="directdebit" {% if expense.user == 'directdebit' or not expense.id %}selected{% endif %}>directdebit</option>
                    <option value="bulkupload" {% if expense.user == 'bulkupload' %}selected{% endif %}>bulkupload</option>
                </select>
            </div>
            <div class="col-span-1">
                <input type="number" name="expense_type" value="{{ expense.expense_type if expense.expense_type is not none else '' }}" placeholder="Type" class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-lg px-2 py-1.5 text-xs text-white text-center outline-none font-mono">
            </div>
            <div class="col-span-2">
                <input type="number" step="0.01" name="amount" required value="{{ expense.amount or '' }}" placeholder="Amount (-15.50)" class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 rounded-lg px-2.5 py-1.5 text-xs text-white text-right outline-none">
            </div>
            <div class="col-span-2 text-right flex justify-end gap-2 px-2">
                <button type="submit" class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20 flex items-center justify-center transition-colors" title="Save">
                    <i class="fa-solid fa-check"></i>
                </button>
                <button type="button" 
                        {% if expense.id %}
                            hx-get="/expenses/{{ expense.id }}" 
                            hx-target="#expense-row-{{ expense.id }}" 
                            hx-swap="outerHTML"
                        {% else %}
                            onclick="document.getElementById('expense-row-new').remove();"
                        {% endif %}
                        class="w-8 h-8 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center transition-colors" title="Cancel">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </form>
    </td>
</tr>
