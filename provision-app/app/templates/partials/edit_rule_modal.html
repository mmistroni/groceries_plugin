<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
            <h3 class="text-base font-semibold text-white">Edit Scheduled Rule</h3>
            <button 
                onclick="document.getElementById('modal-container').innerHTML=''" 
                class="text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Form -->
        <form 
            hx-post="/admin-settings/rules/{{ rule.id }}/edit" 
            hx-target="#rule-row-{{ rule.id }}" 
            hx-swap="outerHTML" 
            onclick="if (event.target === this) document.getElementById('modal-container').innerHTML=''"
            class="p-6 space-y-4">

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Description</label>
                <input type="text" name="description" value="{{ rule.description }}" class="w-full bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-brand-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Rule Type</label>
                    <select name="rule_type" class="w-full bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-700">
                        <option value="direct_debit" {% if rule.rule_type == 'direct_debit' %}selected{% endif %}>Direct Debit</option>
                        <option value="lump_sum" {% if rule.rule_type == 'lump_sum' %}selected{% endif %}>Lump Sum</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Day of Month</label>
                    <input type="number" name="day_of_month" value="{{ rule.day_of_month }}" min="1" max="31" class="w-full bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-700">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Expense Category</label>
                    <select name="expense_type" class="w-full bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-700">
                        {% for item in ExpenseTypeEnum %}
                            <option value="{{ item.value }}" {% if rule.expense_type is not none and rule.expense_type|int == item.value %}selected{% endif %}>
                                {{ item.display_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">User</label>
                    <input type="text" name="user" value="{{ rule.user }}" class="w-full bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-700">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 items-center">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Amount (£)</label>
                    <input type="number" step="0.01" name="amount" value="{{ rule.amount }}" class="w-full bg-slate-800 text-white text-sm rounded-lg px-3 py-2 border border-slate-700">
                </div>
                <div class="pt-5 flex items-center gap-2">
                    <input type="checkbox" id="is_active" name="is_active" value="true" {% if rule.is_active %}checked{% endif %} class="rounded bg-slate-800 border-slate-700 text-brand-600 focus:ring-0">
                    <label for="is_active" class="text-xs font-medium text-slate-300">Active Rule</label>
                </div>
            </div>

            <!-- Footer Buttons -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                <button 
                    type="button" 
                    onclick="document.getElementById('modal-container').innerHTML=''" 
                    class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white transition-colors">
                    Cancel
                </button>
                <button 
                    type="submit" 
                    onclick="setTimeout(() => { document.getElementById('modal-container').innerHTML='' }, 100)"
                    class="px-4 py-2 text-xs font-medium bg-brand-600 hover:bg-brand-500 text-white rounded-lg transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
