<tr id="expense-row-{{ expense.id }}" class="hover:bg-slate-900/30 transition-all">
    <td class="py-3 px-4 text-slate-400 whitespace-nowrap">
        {{ expense.date.strftime('%Y-%m-%d') }}
    </td>
    <td class="py-3 px-4 font-medium text-white max-w-[200px] truncate animate-fade-in" title="{{ expense.description }}">
        {{ expense.description }}
    </td>
    <td class="py-3 px-4 whitespace-nowrap">
        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-900 border border-slate-800 text-slate-300">
            {{ expense.user }}
        </span>
    </td>
    <td class="py-3 px-4 text-slate-400 text-center font-mono">
        {{ expense.expense_type if expense.expense_type is not none else '-' }}
    </td>
    <td class="py-3 px-4 text-right font-semibold whitespace-nowrap {% if expense.amount < 0 %}text-rose-400{% else %}text-emerald-400{% endif %}">
        {% if expense.amount >= 0 %}+{% endif %}£{{ "%.2f"|format(expense.amount) }}
    </td>
    <td class="py-3 px-4 whitespace-nowrap text-right text-sm font-medium">
        <button hx-get="/expenses/{{ expense.id }}/edit" hx-target="#expense-row-{{ expense.id }}" hx-swap="outerHTML" class="text-brand-400 hover:text-brand-300 mr-3 transition-colors" title="Edit">
            <i class="fa-solid fa-pen"></i>
        </button>
        <button hx-delete="/expenses/{{ expense.id }}" hx-target="#expense-row-{{ expense.id }}" hx-swap="outerHTML" hx-confirm="Are you sure you want to delete this expense entry?" class="text-rose-400 hover:text-rose-300 transition-colors" title="Delete">
            <i class="fa-solid fa-trash"></i>
        </button>
    </td>
</tr>
