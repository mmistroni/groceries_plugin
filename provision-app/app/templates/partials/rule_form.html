<tr id="rule-form-row" class="bg-slate-900/60 border-b border-slate-800 animate-fade-in">
    <td class="py-2 px-2">
        <input type="text" name="description" value="{{ rule.description if rule else '' }}" placeholder="Description" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none focus:border-brand-500">
    </td>

    <td class="py-2 px-2">
        <select name="rule_type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white outline-none focus:border-brand-500">
            <option value="direct_debit" {% if rule and rule.rule_type == 'direct_debit' %}selected{% endif %}>Direct Debit</option>
            <option value="lump_sum" {% if rule and rule.rule_type == 'lump_sum' %}selected{% endif %}>Lump Sum</option>
        </select>
    </td>

    <td class="py-2 px-2 text-center">
        <input type="number" min="1" max="31" name="day_of_month" value="{{ rule.day_of_month if rule else 1 }}" required class="w-16 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white outline-none text-center focus:border-brand-500">
    </td>

    <td class="py-2 px-2">
        <select name="expense_type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white outline-none focus:border-brand-500">
            <option value="" disabled {% if not rule or rule.expense_type is none %}selected{% endif %}>Select category</option>
            {% for category in ExpenseTypeEnum %}
                <option value="{{ category.value }}" {% if rule and rule.expense_type|int == category.value %}selected{% endif %}>
                    {{ category.display_name if category.display_name is defined else category.name.replace('_', ' ').title() }}
                </option>
            {% endfor %}
        </select>
    </td>

    <td class="py-2 px-2">
        <input type="text" name="user" value="{{ rule.user if rule else 'directdebit' }}" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none focus:border-brand-500">
    </td>

    <td class="py-2 px-2">
        <input type="number" step="0.01" name="amount" value="{{ rule.amount if rule else '' }}" placeholder="Amount" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none text-right focus:border-brand-500">
    </td>

    <td class="py-2 px-2 text-center">
        <input type="checkbox" name="is_active" value="true" {% if not rule or rule.is_active %}checked{% endif %} class="accent-brand-500 rounded">
    </td>

    <td class="py-2 px-2 text-right whitespace-nowrap">
        <button type="button" 
                hx-post="{% if rule %}/admin-settings/rules/{{ rule.id }}/edit{% else %}/admin-settings/rules/new{% endif %}"
                hx-include="closest tr"
                hx-target="{% if rule %}#rule-row-{{ rule.id }}{% else %}#rule-form-row{% endif %}"
                hx-swap="outerHTML"
                class="text-emerald-400 hover:text-emerald-300 mr-2 transition-colors cursor-pointer" title="Save">
            <i class="fa-solid fa-check"></i>
        </button>
        <button type="button" onclick="this.closest('tr').remove()" class="text-rose-400 hover:text-rose-300 transition-colors cursor-pointer" title="Cancel">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </td>
</tr>
